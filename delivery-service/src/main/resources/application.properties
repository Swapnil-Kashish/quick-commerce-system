server.port=8088

spring.application.name=delivery-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://quick-postgres:5432/quickcommerce
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.default_schema=delivery_service
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

# Eureka
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka

spring.kafka.consumer.group-id=delivery-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.quickcommerce.delivery_service.kafka.OrderEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false