spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:postgresql://postgres:5432/quickcommerce
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=payment_service

spring.kafka.bootstrap-servers=kafka:9092

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.type.mapping=\
com.quickcommerce.order_service.kafka.OrderEvent:com.quickcommerce.payment_service.dto.OrderEvent,\
com.quickcommerce.inventory_service.model.InventoryResponseEvent:com.quickcommerce.payment_service.dto.InventoryResponseEvent