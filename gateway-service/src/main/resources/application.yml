spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders,/orders/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory,/inventory/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/profile/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**,/products

        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart/**

server:
  port: 8080