spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders,/orders/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory,/inventory/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/profile/**

server:
  port: 8080